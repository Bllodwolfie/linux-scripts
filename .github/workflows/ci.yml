name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install packaging and script dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper lintian jq libglib2.0-bin xdg-user-dirs

      - name: Verify clean tree
        run: |
          test -z "$(git status --porcelain)" || { echo "tree is not clean:"; git status --porcelain; exit 1; }

      - name: Build (Release)
        run: dotnet build src/ScriptSuite/ScriptSuite.csproj -c Release --nologo

      - name: Headless self-tests (stages 2-9)
        run: src/ScriptSuite/bin/Release/net8.0/ScriptSuite --self-test

      - name: Cross-uid elevation handoff (root child, caller-owned result)
        # Needs passwordless sudo (runners have it); the test SKIPs anywhere
        # else. Proves end to end that the root child fchowns its rendezvous
        # files to the caller — the 10:42 root-0600 regression cannot recur.
        run: bash tests/test-cross-uid-ci.sh

      - name: Build .deb from a clean git-archive export
        # The checkout above holds dotnet build outputs (bin/, obj/) that
        # must never enter the package. Export HEAD to /tmp/ss-build (the
        # same procedure used for local builds) and build there; outputs
        # land in /tmp (the export's parent dir).
        # -b: binary-only (no source package). -d: the .NET SDK comes from
        # setup-dotnet, not the dotnet-sdk-8.0 build-dep.
        run: |
          rm -rf /tmp/ss-build && mkdir -p /tmp/ss-build
          git archive HEAD | tar -x -C /tmp/ss-build
          cd /tmp/ss-build && dpkg-buildpackage -us -uc -b -d

      - name: lintian (errors fail the job)
        run: lintian /tmp/scriptsuite_*_amd64.changes

      - name: Stage .deb
        run: |
          mkdir -p dist
          cp /tmp/scriptsuite_*_amd64.deb dist/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: scriptsuite-deb
          path: dist/*.deb
