name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install packaging and script dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper lintian jq libglib2.0-bin xdg-user-dirs

      - name: Verify clean tree
        run: |
          test -z "$(git status --porcelain)" || { echo "tree is not clean:"; git status --porcelain; exit 1; }

      - name: Build (Release)
        run: dotnet build src/ScriptSuite/ScriptSuite.csproj -c Release --nologo

      - name: Headless self-tests (stages 2-9)
        run: src/ScriptSuite/bin/Release/net8.0/ScriptSuite --self-test

      - name: Build .deb from the clean checkout
        # -d: the .NET SDK comes from setup-dotnet, not the dotnet-sdk-8.0
        # build-dep (same documented dispensation as local builds).
        run: dpkg-buildpackage -us -uc -d

      - name: lintian (errors fail the job)
        run: lintian ../scriptsuite_*_amd64.changes

      - name: Stage .deb
        run: |
          mkdir -p dist
          cp ../scriptsuite_*_amd64.deb dist/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: scriptsuite-deb
          path: dist/*.deb
